<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>État initial de l'environnement, étude de cas</title>
<meta name="description" content="Carte interactive de l'état initial de l'environnement d'une centrale photovoltaïque au sol sur une friche du Douaisis : enjeux hiérarchisés, criblage des friches, zonages, urbanisme, espèces connues.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%275%27 fill=%27%231d3557%27/%3E%3Cpath d=%27M11 11 L21 12 L20 21 L12 20 Z%27 fill=%27none%27 stroke=%27%23f4a259%27 stroke-width=%272%27/%3E%3C/svg%3E">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --nuit: #1d3557; --nuit-clair: #a8c5e8; --encre: #1f2a36; --gris: #5b6470; --trait: #d9dde3;
    --fond: #ffffff; --fond-doux: #f3f5f8; --accent: #b5452a;
    --tres-fort: #7f0000; --fort: #d7301f; --modere: #fc8d59; --faible: #fdd49e; --nul: #ececec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--encre);
    font-family: "Times New Roman", Times, serif; font-size: 16px; }
  header { background: var(--nuit); color: #fff; padding: 12px 20px; }
  header h1 { margin: 0; font-size: 1.45rem; font-weight: 700; }
  header p { margin: 2px 0 0; color: var(--nuit-clair); font-style: italic; font-size: 0.98rem; }
  main { display: grid; grid-template-columns: 410px 1fr; height: calc(100% - 66px); }
  #panneau { display: flex; flex-direction: column; border-right: 1px solid var(--trait); min-height: 0; }
  nav { display: flex; border-bottom: 1px solid var(--trait); }
  nav button { flex: 1; font: inherit; font-size: 0.98rem; padding: 10px 4px; background: none; border: 0;
    border-bottom: 3px solid transparent; color: var(--gris); cursor: pointer; }
  nav button[aria-selected="true"] { color: var(--nuit); border-bottom-color: var(--nuit); font-weight: 700; }
  .onglet { display: none; overflow-y: auto; padding: 16px 18px 28px; }
  .onglet.actif { display: block; }
  h2 { font-size: 1.15rem; color: var(--nuit); margin: 18px 0 6px; }
  h2:first-child { margin-top: 0; }
  p { line-height: 1.42; margin: 6px 0; }
  .chiffres { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 4px; }
  .chiffre { background: var(--fond-doux); border-radius: 6px; padding: 9px 11px; }
  .chiffre b { display: block; font-size: 1.45rem; color: var(--nuit); font-variant-numeric: tabular-nums; }
  .chiffre span { font-size: 0.88rem; color: var(--gris); }
  .note { font-size: 0.88rem; color: var(--gris); font-style: italic; border-left: 3px solid var(--trait);
    padding-left: 10px; margin-top: 14px; }
  .enjeu { border-bottom: 1px solid var(--trait); padding: 9px 0; }
  .enjeu summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; list-style: none; }
  .enjeu summary::-webkit-details-marker { display: none; }
  .enjeu p { font-size: 0.93rem; margin: 6px 0 2px 0; }
  .pastille { display: inline-block; min-width: 70px; text-align: center; font-size: 0.8rem; border-radius: 10px;
    padding: 1px 8px; color: #fff; white-space: nowrap; }
  .p-tres-fort { background: var(--tres-fort); } .p-fort { background: var(--fort); }
  .p-modere { background: var(--modere); color: var(--encre); } .p-faible { background: var(--faible); color: var(--encre); }
  .p-nul { background: var(--nul); color: var(--gris); }
  .zoom { font: inherit; font-size: 0.85rem; color: var(--nuit); background: none; border: 1px solid var(--trait);
    border-radius: 4px; padding: 1px 7px; cursor: pointer; margin-top: 4px; }
  .theme { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--gris); margin: 16px 0 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  td, th { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--trait); vertical-align: top; }
  tr.cliquable { cursor: pointer; } tr.cliquable:hover { background: var(--fond-doux); }
  .couche { display: flex; align-items: center; gap: 9px; padding: 5px 0; font-size: 0.96rem; }
  .couche input { width: 16px; height: 16px; accent-color: var(--nuit); }
  .echantillon { width: 22px; height: 13px; border-radius: 2px; flex: none; border: 1px solid rgba(0,0,0,0.15); }
  .fonds { display: flex; gap: 6px; margin: 4px 0 10px; }
  .fonds button { font: inherit; font-size: 0.92rem; flex: 1; padding: 6px; border: 1px solid var(--trait);
    background: #fff; border-radius: 5px; cursor: pointer; }
  .fonds button[aria-pressed="true"] { background: var(--nuit); color: #fff; border-color: var(--nuit); }
  #carte { min-height: 0; }
  .maplibregl-popup-content { font-family: "Times New Roman", Times, serif; font-size: 0.95rem; max-width: 300px; }
  .maplibregl-popup-content h3 { margin: 0 0 4px; font-size: 1rem; color: var(--nuit); }
  a { color: var(--nuit); }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    #carte { order: 1; height: 55vh; } #panneau { order: 2; border-right: 0; }
    header h1 { font-size: 1.15rem; }
  }
</style>
</head>
<body>
<header>
  <h1>État initial de l'environnement, étude de cas</h1>
  <p id="sous-titre">Centrale photovoltaïque au sol sur une friche du Douaisis</p>
</header>
<main>
  <section id="panneau" aria-label="Informations de l'étude">
    <nav role="tablist">
      <button role="tab" aria-selected="true" data-onglet="site">Le site</button>
      <button role="tab" aria-selected="false" data-onglet="enjeux">Enjeux</button>
      <button role="tab" aria-selected="false" data-onglet="criblage">Criblage</button>
      <button role="tab" aria-selected="false" data-onglet="couches">Couches</button>
    </nav>
    <div class="onglet actif" id="o-site"></div>
    <div class="onglet" id="o-enjeux"></div>
    <div class="onglet" id="o-criblage"></div>
    <div class="onglet" id="o-couches"></div>
  </section>
  <div id="carte" role="region" aria-label="Carte"></div>
</main>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const NIVEAU = { "Très fort": "tres-fort", "Fort": "fort", "Modéré": "modere", "Faible": "faible", "Nul": "nul" };
const COUL_NIVEAU = { "Très fort": "#7f0000", "Fort": "#d7301f", "Modéré": "#fc8d59", "Faible": "#fdd49e" };
const CLASSE = { "Favorable": "#1a9850", "À approfondir": "#fee08b", "Défavorable": "#f46d43", "Exclu": "#bdbdbd" };
const WMTS = c => `https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${c}` +
  `&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=` +
  (c.startsWith("ORTHO") ? "image/jpeg" : "image/png");
const fr = (x, d = 1) => Number(x).toLocaleString("fr-FR", { maximumFractionDigits: d });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Couches thématiques : fichier, type, style, libellé de légende
const COUCHES = [
  { id: "epci", titre: "Douaisis Agglo", fichier: "epci", visible: true, type: "line",
    paint: { "line-color": "#1d3557", "line-width": 1.5, "line-opacity": 0.7 }, echantillon: "#1d3557" },
  { id: "criblage", titre: "Criblage des friches", fichier: "criblage", visible: false, type: "fill",
    paint: { "fill-color": ["match", ["get", "classe"], ...Object.entries(CLASSE).flat(), "#999"], "fill-opacity": 0.75,
             "fill-outline-color": "#333" }, echantillon: "#1a9850" },
  { id: "plu", titre: "Zonage du PLU", fichier: "plu", visible: false, type: "fill",
    paint: { "fill-color": ["match", ["slice", ["get", "typezone"], 0, 1], "U", "#e41a1c", "A", "#ffd92f", "N", "#4daf4a", "#ff7f00"],
             "fill-opacity": 0.35, "fill-outline-color": "#555" }, echantillon: "#e9a3a3" },
  { id: "zones_humides", titre: "Zones à dominante humide", fichier: "zones_humides", visible: false, type: "fill",
    paint: { "fill-color": "#6baed6", "fill-opacity": 0.45 }, echantillon: "#9ecae1" },
  { id: "unesco_tampon", titre: "Zone tampon du patrimoine mondial", fichier: "unesco_tampon", visible: false, type: "fill",
    paint: { "fill-color": "#f4a582", "fill-opacity": 0.35, "fill-outline-color": "#d6604d" }, echantillon: "#f4a582" },
  { id: "unesco_bien", titre: "Bassin minier inscrit au patrimoine mondial", fichier: "unesco_bien", visible: true, type: "fill",
    paint: { "fill-color": "#b2182b", "fill-opacity": 0.6 }, echantillon: "#b2182b" },
  { id: "pnr", titre: "Parc naturel régional", fichier: "pnr", visible: true, type: "line",
    paint: { "line-color": "#33a02c", "line-width": 2, "line-dasharray": [3, 2] }, echantillon: "#33a02c" },
  { id: "znieff2", titre: "ZNIEFF de type II", fichier: "znieff2", visible: true, type: "fill",
    paint: { "fill-color": "#7fbf7b", "fill-opacity": 0.25, "fill-outline-color": "#5a9e56" }, echantillon: "#cfe6cd" },
  { id: "znieff1", titre: "ZNIEFF de type I", fichier: "znieff1", visible: true, type: "fill",
    paint: { "fill-color": "#4daf4a", "fill-opacity": 0.35, "fill-outline-color": "#2e7d32" }, echantillon: "#4daf4a" },
  { id: "natura2000", titre: "Natura 2000 (directive Habitats)", fichier: "natura2000", visible: true, type: "fill",
    paint: { "fill-color": "#1f78b4", "fill-opacity": 0.3, "fill-outline-color": "#1f78b4" }, echantillon: "#1f78b4" },
  { id: "reserves", titre: "Réserve naturelle", fichier: "reserves", visible: true, type: "fill",
    paint: { "fill-color": "#1b7837", "fill-opacity": 0.55 }, echantillon: "#1b7837" },
  { id: "enjeux", titre: "Enjeux spatialisés", fichier: "enjeux", visible: true, type: "fill",
    paint: { "fill-color": ["match", ["get", "niveau"], ...Object.entries(COUL_NIVEAU).flat(), "#ccc"], "fill-opacity": 0.45,
             "fill-outline-color": "#7f0000" }, echantillon: "#fc8d59" },
  { id: "especes", titre: "Observations d'espèces patrimoniales", fichier: "especes", visible: false, type: "circle",
    paint: { "circle-radius": 4, "circle-color": "#1f78b4", "circle-stroke-color": "#fff", "circle-stroke-width": 1 },
    echantillon: "#1f78b4" },
  { id: "aires", titre: "Aires d'étude", fichier: "aires", visible: true, type: "line",
    paint: { "line-color": ["match", ["get", "aire"], "immediate", "#ff7f00", "rapprochee", "#6a3d9a", "eloignee", "#252525", "#e31a1c"],
             "line-width": 1.6, "line-dasharray": [4, 2] }, echantillon: "#6a3d9a" },
  { id: "zip", titre: "Zone d'implantation potentielle", fichier: "zip", visible: true, type: "line",
    paint: { "line-color": "#e31a1c", "line-width": 3 }, echantillon: "#e31a1c" },
];

const carte = new maplibregl.Map({
  container: "carte",
  style: { version: 8, sources: {
      plan: { type: "raster", tiles: [WMTS("GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2")], tileSize: 256, attribution: "© IGN Plan IGN v2" },
      ortho: { type: "raster", tiles: [WMTS("ORTHOIMAGERY.ORTHOPHOTOS")], tileSize: 256, attribution: "© IGN BD ORTHO" } },
    layers: [{ id: "fond-plan", type: "raster", source: "plan", paint: { "raster-saturation": -0.9, "raster-opacity": 0.85 } },
             { id: "fond-ortho", type: "raster", source: "ortho", layout: { visibility: "none" } }] },
  center: [3.05, 50.33], zoom: 13, attributionControl: { compact: true },
});
carte.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), "top-right");
carte.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-left");

const donnees = {};
async function charger(fichier) {
  try { const r = await fetch(`donnees/${fichier}.geojson`); return r.ok ? await r.json() : null; }
  catch { return null; }
}
function emprise(geojson) {
  const b = new maplibregl.LngLatBounds();
  const parcourir = c => typeof c[0] === "number" ? b.extend(c) : c.forEach(parcourir);
  (geojson.features || [geojson]).forEach(f => f.geometry && parcourir(f.geometry.coordinates));
  return b;
}
const zoomSur = (geo, marge = 60) => carte.fitBounds(emprise(geo), { padding: marge, maxZoom: 17 });

function popup(e, html) { new maplibregl.Popup({ maxWidth: "320px" }).setLngLat(e.lngLat).setHTML(html).addTo(carte); }
const POPUPS = {
  criblage: p => `<h3>${esc(p.rang)}. ${esc(p.site_nom)}</h3>${esc(p.commune)}, ${fr(p.surface_ha)} ha<br>
    <b>${esc(p.classe)}</b>${p.contraintes ? `<br>Contraintes : ${esc(p.contraintes)}` : ""}${p.atouts ? `<br>Atouts : ${esc(p.atouts)}` : ""}`,
  plu: p => `<h3>Zone ${esc(p.libelle)}</h3>${esc(p.libelong)}`,
  zones_humides: p => `<h3>Zone à dominante humide</h3>${esc(p.milieu)}`,
  znieff1: p => `<h3>ZNIEFF de type I</h3>${esc(p.nom)}${p.url ? `<br><a href="${esc(p.url)}" target="_blank" rel="noopener">Fiche INPN</a>` : ""}`,
  znieff2: p => `<h3>ZNIEFF de type II</h3>${esc(p.nom)}`,
  natura2000: p => `<h3>Natura 2000</h3>${esc(p.nom)}`,
  reserves: p => `<h3>Réserve naturelle</h3>${esc(p.nom)}`,
  unesco_bien: p => `<h3>Patrimoine mondial</h3>${esc(p.nom)}`,
  enjeux: p => `<h3>${esc(p.sujet)}</h3><span class="pastille p-${NIVEAU[p.niveau]}">${esc(p.niveau)}</span> ${esc(p.theme)}`,
  especes: p => `<h3>${esc(p.nom_francais || p.nom_scientifique)}</h3><i>${esc(p.nom_scientifique)}</i><br>${esc(p.groupe)}, observé en ${esc(p.annee)}`,
};

carte.on("load", async () => {
  for (const c of COUCHES) {
    const geo = await charger(c.fichier);
    if (!geo || !geo.features.length) continue;
    donnees[c.id] = geo;
    carte.addSource(c.id, { type: "geojson", data: geo });
    carte.addLayer({ id: c.id, type: c.type, source: c.id, paint: c.paint,
                     layout: { visibility: c.visible ? "visible" : "none" } });
    if (POPUPS[c.id]) {
      carte.on("click", c.id, e => popup(e, POPUPS[c.id](e.features[0].properties)));
      carte.on("mouseenter", c.id, () => carte.getCanvas().style.cursor = "pointer");
      carte.on("mouseleave", c.id, () => carte.getCanvas().style.cursor = "");
    }
  }
  if (donnees.aires) zoomSur({ features: donnees.aires.features.filter(f => f.properties.aire === "rapprochee") }, 30);
  remplirCouches();
});

// --- Panneau -----------------------------------------------------------------------------
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll(".onglet").forEach(o => o.classList.toggle("actif", o.id === `o-${b.dataset.onglet}`));
}));

function remplirCouches() {
  const o = document.getElementById("o-couches");
  o.innerHTML = `<h2>Fond de plan</h2><div class="fonds"><button aria-pressed="true" data-fond="plan">Plan IGN</button>
    <button aria-pressed="false" data-fond="ortho">Photographies aériennes</button></div><h2>Couches</h2>`;
  [...COUCHES].reverse().filter(c => donnees[c.id]).forEach(c => {
    const l = document.createElement("label");
    l.className = "couche";
    l.innerHTML = `<input type="checkbox" ${c.visible ? "checked" : ""}><span class="echantillon" style="background:${c.echantillon}"></span>${esc(c.titre)}`;
    l.querySelector("input").addEventListener("change", e => carte.setLayoutProperty(c.id, "visibility", e.target.checked ? "visible" : "none"));
    o.appendChild(l);
  });
  o.insertAdjacentHTML("beforeend", `<p class="note">Fonds : © IGN. Données : IGN, INPN, Géo2France, Géoportail de l'Urbanisme, Cerema, GBIF. Le parcellaire et les propriétaires ne sont pas publiés sur cette carte.</p>`);
  o.querySelectorAll(".fonds button").forEach(b => b.addEventListener("click", () => {
    o.querySelectorAll(".fonds button").forEach(x => x.setAttribute("aria-pressed", x === b));
    carte.setLayoutProperty("fond-plan", "visibility", b.dataset.fond === "plan" ? "visible" : "none");
    carte.setLayoutProperty("fond-ortho", "visibility", b.dataset.fond === "ortho" ? "visible" : "none");
  }));
}

function afficherCouche(id, visible = true) {
  if (!carte.getLayer(id)) return;
  carte.setLayoutProperty(id, "visibility", visible ? "visible" : "none");
  const cases = [...document.querySelectorAll("#o-couches .couche")].find(l => l.textContent.trim() === COUCHES.find(c => c.id === id).titre);
  if (cases) cases.querySelector("input").checked = visible;
}

fetch("donnees/etude.json").then(r => r.json()).then(E => {
  document.getElementById("sous-titre").textContent =
    `${E.site}, ${E.commune} (Nord) : centrale photovoltaïque au sol`;
  const n = niv => E.enjeux.filter(e => e.niveau === niv).length;
  const plu = E.plu.find(z => /photovolta/i.test(z.intitule));
  document.getElementById("o-site").innerHTML = `
    <h2>${esc(E.site)}</h2>
    <p>Friche industrielle de ${fr(E.surface_ha)} ha à ${esc(E.commune)}, seule friche retenue par le criblage des
       ${E.nb_friches} friches de Douaisis Agglo pour une centrale photovoltaïque au sol.</p>
    <div class="chiffres">
      <div class="chiffre"><b>${fr(E.surface_ha)} ha</b><span>zone d'implantation potentielle</span></div>
      <div class="chiffre"><b>${n("Très fort") + n("Fort")} et ${n("Modéré")}</b><span>enjeux forts et modérés, sur ${E.enjeux.length}</span></div>
      <div class="chiffre"><b>${E.especes.total}</b><span>espèces connues alentour, dont ${E.especes.patrimoniales} patrimoniales</span></div>
      <div class="chiffre"><b>${E.reconvertis}</b><span>« friches » de plus de 3 ha déjà reconverties, écartées</span></div>
    </div>
    ${plu ? `<h2>Ce que prévoit le PLU</h2><p>${fr(plu.part * 100, 0)} % du site est en secteur <b>${esc(plu.zone)}</b> :
       « ${esc(plu.intitule)} ». Le criblage, fait avec les seules données ouvertes, retrouve un choix déjà inscrit par la collectivité.</p>` : ""}
    <h2>La démarche</h2>
    <p>Aires d'étude immédiate (200 m), rapprochée (1 km) et éloignée (5 km) ; une quarantaine de flux ouverts interrogés
       automatiquement ; ${E.enjeux.length} sujets hiérarchisés par des règles explicites ; atlas A3 de 18 cartes.</p>
    <p>Les traitements ont été réalisés avec les outils de QGIS (trois modèles du modeleur graphique) et reproduits en Python :
       une seule commande relance toute l'étude en quelques minutes, avec les mêmes résultats.</p>
    <p class="note">${esc(E.cartouche)} Hiérarchisation indicative, à consolider par les inventaires de terrain. Réalisation : ${esc(E.auteur)}.</p>`;

  let html = "", theme = "";
  E.enjeux.forEach((e, i) => {
    if (e.theme !== theme) { theme = e.theme; html += `<div class="theme">${esc(theme)}</div>`; }
    const spatial = donnees.enjeux?.features.some(f => f.properties.sujet === e.sujet);
    html += `<details class="enjeu"><summary><span class="pastille p-${NIVEAU[e.niveau]}">${esc(e.niveau)}</span>${esc(e.sujet)}</summary>
      <p>${esc(e.justification)}</p>${spatial ? `<button class="zoom" data-sujet="${esc(e.sujet)}">Voir sur la carte</button>` : ""}</details>`;
  });
  const oe = document.getElementById("o-enjeux");
  oe.innerHTML = `<h2>Hiérarchisation des enjeux</h2><p>Chaque sujet est classé de « nul » à « très fort » selon sa présence sur le site et sa distance.</p>` + html;
  oe.addEventListener("click", ev => {
    const s = ev.target.dataset?.sujet; if (!s) return;
    afficherCouche("enjeux");
    zoomSur({ features: donnees.enjeux.features.filter(f => f.properties.sujet === s) });
  });

  const c = E.classes;
  document.getElementById("o-criblage").innerHTML = `
    <h2>Où implanter une centrale au sol ?</h2>
    <p>Les ${E.nb_friches} friches recensées par Cartofriches sur Douaisis Agglo sont classées dans PostGIS selon une grille de critères :
       protections naturelles, zones humides, plans de prévention, patrimoine mondial, riverains, réseau électrique, surface,
       et usage actuel du sol d'après l'OCS GE.</p>
    <div class="chiffres">${Object.entries(CLASSE).map(([k, col]) =>
      `<div class="chiffre" style="border-left:5px solid ${col}"><b>${c[k] || 0}</b><span>${k}</span></div>`).join("")}</div>
    <p>${E.reconvertis} friches de plus de 3 ha sont en réalité déjà reconstruites ou en activité : l'usage du sol de l'OCS GE
       et la photographie aérienne les ont écartées.</p>
    <table id="tableau-criblage"><thead><tr><th>Rang</th><th>Friche</th><th>Classe</th></tr></thead><tbody></tbody></table>
    <p class="note">Cliquer sur une ligne pour la situer.</p>`;
  const remplir = () => {
    if (!donnees.criblage) return setTimeout(remplir, 300);
    const corps = document.querySelector("#tableau-criblage tbody");
    donnees.criblage.features.slice().sort((a, b) => a.properties.rang - b.properties.rang).slice(0, 12).forEach(f => {
      const p = f.properties, tr = document.createElement("tr");
      tr.className = "cliquable";
      tr.innerHTML = `<td>${p.rang}</td><td>${esc(p.site_nom)}<br><small>${esc(p.commune)}, ${fr(p.surface_ha)} ha</small></td>
        <td><span class="pastille" style="background:${CLASSE[p.classe]};color:${p.classe === "Favorable" ? "#fff" : "#1f2a36"}">${esc(p.classe)}</span></td>`;
      tr.addEventListener("click", () => { afficherCouche("criblage"); zoomSur(f, 120); });
      corps.appendChild(tr);
    });
  };
  remplir();
  document.querySelector('[data-onglet="criblage"]').addEventListener("click", () => {
    afficherCouche("criblage");
    if (donnees.epci) zoomSur(donnees.epci, 20);
  });
});
</script>
</body>
</html>
